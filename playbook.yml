---
- name: Install Cloudflared on Ubuntu/Debian
  hosts: web
  become: true
  gather_facts: true

  tasks:
    - name: Ensure apt-transport-https and ca-certificates are installed
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true
      when: ansible_os_family == 'Debian' and ansible_distribution == 'Ubuntu' and ansible_distribution_version == '22.04'

    - name: Download Cloudflare GPG key
      ansible.builtin.get_url:
        url: https://pkg.cloudflare.com/cloudflare-main.gpg
        dest: /usr/share/keyrings/cloudflare-main.gpg
        mode: '0644'
      when: ansible_os_family == 'Debian'

    - name: Add Cloudflared apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared jammy main"
        filename: cloudflared
        state: present
      when: ansible_os_family == 'Debian' and ansible_distribution == 'Ubuntu' and ansible_distribution_version == '22.04'

    - name: Update apt cache after adding repository
      ansible.builtin.apt:
        update_cache: true
      when: ansible_os_family == 'Debian' and ansible_distribution == 'Ubuntu' and ansible_distribution_version == '22.04'

    - name: Install cloudflared
      ansible.builtin.apt:
        name: cloudflared
        state: present
      when: ansible_os_family == 'Debian' and ansible_distribution == 'Ubuntu' and ansible_distribution_version == '22.04'
