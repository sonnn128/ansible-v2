---
- name: Install Cloudflared and configure Rancher nginx
  hosts: web
  become: true
  gather_facts: true

  vars:
    cloudflared_tunnel_id: "a1fb09eb-c4d3-4151-a66b-6ad84dc76333"
    cloudflared_hostname: "rancher.nobison.online"
    cloudflared_service_url: "http://192.168.1.101:80"
    vault_port: "8200"

  tasks:
    - name: Ensure required packages are installed
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - nginx
        state: present
        update_cache: true
      when: ansible_os_family == 'Debian'

    - name: Add Cloudflare GPG key
      ansible.builtin.get_url:
        url: https://pkg.cloudflare.com/cloudflare-main.gpg
        dest: /usr/share/keyrings/cloudflare-main.gpg
        mode: "0644"

    - name: Add Cloudflared apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared {{ ansible_distribution_release }} main"
        filename: cloudflared
        state: present

    - name: Install cloudflared
      ansible.builtin.apt:
        name: cloudflared
        state: present
        update_cache: true

    - name: Ensure nginx conf.d exists
      ansible.builtin.file:
        path: /etc/nginx/conf.d
        state: directory
        mode: "0755"

    - name: Deploy Rancher nginx config
      ansible.builtin.copy:
        dest: /etc/nginx/conf.d/rancher.conf
        content: |
          map $http_upgrade $connection_upgrade {
              default upgrade;
              ''      close;
          }

          server {
              listen 80;
              server_name rancher.nobison.online;

              location / {
                  proxy_pass https://192.168.1.108/;
                  proxy_ssl_verify off;

                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;

                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection $connection_upgrade;

                  proxy_read_timeout 3600s;
                  proxy_send_timeout 3600s;
              }
          }
        mode: "0644"
      notify: reload nginx

    - name: Deploy Vault nginx config
      ansible.builtin.copy:
        dest: /etc/nginx/conf.d/vault.conf
        content: |
          upstream my_servers {
              server 192.168.1.110:30080;
          }

          map $http_upgrade $vault_connection_upgrade {
              default upgrade;
              ''      close;
          }

          server {
              listen 80;
              server_name vault.nobison.online;

              location / {
                  proxy_pass http://my_servers;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;

                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection $vault_connection_upgrade;

                  proxy_read_timeout 3600s;
                  proxy_send_timeout 3600s;
              }
          }
        mode: "0644"
      notify: reload nginx

    - name: Validate nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Ensure nginx is running
      ansible.builtin.systemd:
        name: nginx
        enabled: true
        state: started

  handlers:
    - name: reload nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
