---
- name: Install required packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
  when: ansible_os_family == 'Debian'

- name: Ensure keyrings directory exists
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: "0755"

- name: Add cloudflared repo key
  ansible.builtin.get_url:
    url: https://pkg.cloudflare.com/cloudflare-main.gpg
    dest: /usr/share/keyrings/cloudflare-main.gpg
    mode: "0644"

- name: Add cloudflared apt repo
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared {{ ansible_distribution_release }} main"
    filename: cloudflared
    state: present

- name: Install cloudflared
  ansible.builtin.apt:
    name: cloudflared
    state: present
    update_cache: true

- name: Ensure /root/.cloudflared exists
  ansible.builtin.file:
    path: /root/.cloudflared
    state: directory
    mode: "0700"

- name: Copy cert.pem from role files
  ansible.builtin.copy:
    src: cert.pem
    dest: /root/.cloudflared/cert.pem
    mode: "0600"
  no_log: true
  ignore_errors: true

- name: Copy tunnel credentials json from role files
  ansible.builtin.copy:
    src: "{{ cloudflared_tunnel_id }}.json"
    dest: "/root/.cloudflared/{{ cloudflared_tunnel_id }}.json"
    mode: "0600"
  no_log: true
  ignore_errors: true

- name: Deploy config.yml
  ansible.builtin.template:
    src: config.yml.j2
    dest: /etc/cloudflared/config.yml
    mode: "0644"
  notify: restart cloudflared

- name: Install cloudflared as systemd service
  ansible.builtin.command: cloudflared service install
  args:
    creates: /etc/systemd/system/cloudflared.service

- name: Ensure nginx is installed
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
  when: ansible_os_family == 'Debian'

- name: Deploy Nginx upstreams config
  ansible.builtin.copy:
    dest: /etc/nginx/conf.d/upstreams.conf
    content: |
      upstream myservers {
          server 192.168.1.110:30080;
      }
    mode: "0644"
  notify: reload nginx

- name: Deploy Rancher nginx config
  ansible.builtin.copy:
    dest: /etc/nginx/conf.d/rancher.conf
    content: |
      map $http_upgrade $connection_upgrade {
          default upgrade;
          ''      close;
      }

      server {
          listen 80;
          server_name rancher.nobison.online;

          location / {
              proxy_pass https://192.168.1.108/;
              proxy_ssl_verify off;

              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto https;

              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection $connection_upgrade;

              proxy_read_timeout 3600s;
              proxy_send_timeout 3600s;
          }
      }
    mode: "0644"
  notify: reload nginx

